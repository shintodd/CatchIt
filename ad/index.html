<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"CI"; src:url("assets/segoeui.ttf") format("truetype"); font-weight:400; }
      @font-face { font-family:"CI"; src:url("assets/seguisb.ttf") format("truetype"); font-weight:600; }
      @font-face { font-family:"CI"; src:url("assets/segoeuib.ttf") format("truetype"); font-weight:700; }

      :root {
        --brand:#0F2A1D;        /* PulseGreen900 - the app's own canvas ink */
        --brand2:#235432;       /* PulseGreen700 */
        --live:#15803D;        /* TelemetryLiveLight */
        --accent:#FEE909;      /* the approved CatchIt yellow */
        --paper:#F6F8F3;       /* LightCanvasBg */
      }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1080px; height:1920px; overflow:hidden; background:var(--brand); font-family:"CI",sans-serif; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; background:var(--brand); }

      .clip { position:absolute; inset:0; }
      .inner { position:absolute; inset:0; opacity:0; }

      /* ---------- the app itself: a real device capture, framed ---------- */
      .device { position:absolute; left:108px; top:0; width:864px; height:1920px; border-radius:40px;
                overflow:hidden; box-shadow:0 0 0 3px rgba(255,255,255,.14), 0 40px 90px rgba(0,0,0,.55); }
      .device img { position:absolute; left:0; top:0; width:864px; height:1920px; display:block; }

      /* ---------- live pulse overlays, placed on the real UI ---------- */
      .pulse { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%;
               background:var(--accent); box-shadow:0 0 0 0 rgba(254,233,9,.55); }
      .pulse.ring { background:transparent; border:4px solid var(--accent); box-shadow:none; }
      .label { position:absolute; padding:9px 20px; border-radius:999px; background:rgba(15,42,29,.92);
               color:#fff; font-size:26px; font-weight:700; letter-spacing:.02em; white-space:nowrap; }
      .label .dot { display:inline-block; width:12px; height:12px; border-radius:50%; background:var(--accent);
                    margin-right:12px; vertical-align:middle; }

      /* ---------- caption band ---------- */
      #band { position:absolute; left:0; right:0; top:auto; bottom:0; height:340px; display:flex;
              flex-direction:column; align-items:center; justify-content:center; text-align:center;
              background:linear-gradient(180deg,rgba(15,42,29,0) 0%,rgba(15,42,29,.88) 34%,rgba(15,42,29,.97) 62%,var(--brand) 100%); }
      #kick { font-size:30px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); opacity:0; }
      #line { margin-top:18px; font-size:50px; font-weight:600; color:#fff; line-height:1.18; max-width:900px; opacity:0; }

      /* ---------- end card ---------- */
      #end { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:radial-gradient(120% 90% at 50% 24%, #235432 0%, #0F2A1D 58%, #081610 100%); }
      #end .icon { width:300px; height:300px; border-radius:72px; box-shadow:0 30px 80px rgba(0,0,0,.55); }
      #end .name { margin-top:44px; font-size:132px; font-weight:700; letter-spacing:-.045em; color:#fff; line-height:1; }
      #end .rule { margin-top:26px; width:0; height:6px; border-radius:3px; background:var(--accent); }
      #end .tag { margin-top:28px; font-size:44px; font-weight:600; color:rgba(255,255,255,.9); text-align:center; max-width:860px; line-height:1.28; }
      #end .cta { margin-top:50px; padding:28px 66px; border-radius:999px; background:var(--accent); color:#0F2A1D; font-size:46px; font-weight:700; }
      #end .badge { position:absolute; top:96px; left:0; right:0; text-align:center; font-size:26px; font-weight:600;
                    letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.55); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="27.6" data-width="1080" data-height="1920" data-fps="60">

      <!-- 1. the real splash animation, full bleed, with its own sound -->
      <video id="splashvid" src="assets/splash.mp4" data-start="0" data-duration="2.96" data-track-index="0"
             data-has-audio="true" style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;"></video>

      <!-- 2. Bus home -->
      <div class="clip" data-start="3.0" data-duration="4.4" data-track-index="1">
        <div class="inner" id="s2">
          <div class="device" id="d2"><img src="assets/screens/01_bus.png" alt="" /></div>
        </div>
      </div>

      <!-- 3. search -->
      <div class="clip" data-start="7.4" data-duration="2.4" data-track-index="1">
        <div class="inner" id="s3">
          <div class="device" id="d3"><img src="assets/screens/02_search.png" alt="" /></div>
        </div>
      </div>

      <!-- 4. route detail + live map -->
      <div class="clip" data-start="9.8" data-duration="4.4" data-track-index="1">
        <div class="inner" id="s4">
          <div class="device" id="d4"><img src="assets/screens/03_route_map.png" alt="" /></div>
          <div class="pulse ring" id="p4a" style="left:142px; top:203px;"></div>
          <div class="pulse ring" id="p4b" style="left:142px; top:203px;"></div>
        </div>
      </div>

      <!-- 5. the stop rail with live ETAs -->
      <div class="clip" data-start="14.2" data-duration="3.4" data-track-index="1">
        <div class="inner" id="s5">
          <div class="device" id="d5"><img src="assets/screens/04_stop_rail.png" alt="" /></div>
        </div>
      </div>

      <!-- 6. alarm setup -->
      <div class="clip" data-start="17.6" data-duration="3.4" data-track-index="1">
        <div class="inner" id="s6">
          <div class="device" id="d6"><img src="assets/screens/07_alarm_setup.png" alt="" /></div>
        </div>
      </div>

      <!-- 7. the armed alarm -->
      <div class="clip" data-start="21.0" data-duration="2.8" data-track-index="1">
        <div class="inner" id="s7">
          <div class="device" id="d7"><img src="assets/screens/05_alarms.png" alt="" /></div>
          <div class="pulse ring" id="p7" style="left:184px; top:475px;"></div>
        </div>
      </div>

      <!-- 8. end card -->
      <div class="clip" data-start="23.8" data-duration="3.8" data-track-index="1">
        <div class="inner" id="s8">
          <div id="end">
            <div class="badge">RapidKL feeder buses &middot; Klang Valley</div>
            <img class="icon" src="assets/CatchIt_App_Icon_Round.png" alt="" />
            <div class="name">CatchIt</div>
            <div class="rule"></div>
            <div class="tag">Know when your feeder bus is coming &mdash; and when to leave.</div>
            <div class="cta">Get CatchIt</div>
          </div>
        </div>
      </div>

      <!-- caption band -->
      <div id="band" class="clip" data-start="3.0" data-duration="20.8" data-track-index="2">
        <div id="kick">Live</div>
        <div id="line">Real bus positions across Klang Valley</div>
      </div>

      <audio id="bed" src="assets/bed.mp3" data-start="1.0" data-duration="26.6" data-track-index="10" data-volume="0.9"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const CAPS = [
        [3.10, 4.30, "Live",        "Real bus positions across Klang Valley"],
        [7.50, 2.30, "Every route", "Find your bus in seconds"],
        [9.90, 4.30, "Live map",   "Watch the bus move towards you"],
        [14.30, 3.30, "Real ETAs",  "Updated every 30 seconds"],
        [17.70, 3.30, "Two stops",  "Warn me when the bus reaches each stop"],
        [21.10, 2.70, "Armed",      "Leave now, then get to your waiting spot"]
      ];

      /* every scene: the device eases in, then keeps drifting so nothing is ever frozen */
      const SCENES = [
        ["#s2", 3.0, 4.4], ["#s3", 7.4, 2.4], ["#s4", 9.8, 4.4], ["#s5", 14.2, 3.4],
        ["#s6", 17.6, 3.4], ["#s7", 21.0, 2.8], ["#s8", 23.8, 3.8]
      ];
      SCENES.forEach(function (sc) {
        tl.set(sc[0], { opacity: 1 }, sc[1]);
        var dev = sc[0] + " .device";
        tl.fromTo(dev, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, sc[1]);
        if (sc[0] !== "#s8") {
          tl.to(dev, { y: -26, duration: sc[2] * 0.95, ease: "sine.inOut" }, sc[1] + 0.55);
        }
      });

      /* live pulses */
      tl.fromTo("#p4a", { opacity: 1, scale: 0.5 }, { opacity: 0, scale: 2.4, duration: 1.5, repeat: -1, ease: "power2.out" }, 10.4);
      tl.fromTo("#p4b", { opacity: 0.9, scale: 0.8 }, { opacity: 0, scale: 1.9, duration: 1.5, repeat: -1, ease: "power2.out" }, 10.9);

      tl.fromTo("#p7", { opacity: 1, scale: 0.6 }, { opacity: 0, scale: 2.2, duration: 1.5, repeat: -1, ease: "power2.out" }, 21.4);

      /* end card */
      tl.fromTo("#s8 .icon", { opacity: 0, scale: 0.78, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.6)" }, 23.9);
      tl.fromTo("#s8 .name", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 24.2);
      tl.fromTo("#s8 .rule", { width: 0 }, { width: 300, duration: 0.5, ease: "power2.out" }, 24.4);
      tl.fromTo("#s8 .tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 24.55);
      tl.fromTo("#s8 .cta", { opacity: 0, y: 18, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 24.8);
      tl.to("#s8 .icon", { scale: 1.045, duration: 1.6, yoyo: true, repeat: -1, ease: "sine.inOut" }, 25.1);
      tl.to("#s8 .cta", { scale: 1.045, duration: 1.3, yoyo: true, repeat: -1, ease: "sine.inOut" }, 25.1);

      /* captions */
      CAPS.forEach(function (c) {
        tl.set("#kick", { opacity: 0 }, c[0]);
        tl.set("#line", { opacity: 0 }, c[0]);
        tl.set("#kick", { textContent: c[2] }, c[0]);
        tl.set("#line", { textContent: c[3] }, c[0]);
        tl.to("#kick", { opacity: 1, y: 0, duration: 0.28 }, c[0]);
        tl.to("#line", { opacity: 1, y: 0, duration: 0.32 }, c[0] + 0.07);
        tl.to("#kick", { opacity: 0, duration: 0.22 }, c[0] + c[1] - 0.22);
        tl.to("#line", { opacity: 0, duration: 0.22 }, c[0] + c[1] - 0.22);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
